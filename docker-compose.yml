services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: "0.50"
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: .
      target: migrator
    profiles:
      - maintenance
    restart: "no"
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    cpus: "0.50"
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "2"

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3080:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpus: "1.00"
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 256
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    profiles:
      - tunnel
    depends_on:
      web:
        condition: service_healthy
    cpus: "0.15"
    mem_limit: 96m
    memswap_limit: 96m
    pids_limit: 64
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  postgres_data:
