name: Netlify IaC + Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production-deploy
  cancel-in-progress: false

jobs:
  netlify-iac-deploy:
    name: Sync Netlify env and trigger production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@latest

      - name: Apply Netlify IaC and trigger deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DATABASE_URL: ${{ secrets.NETLIFY_DATABASE_URL_PRODUCTION }}
          NODE_VERSION_VALUE: "20"
          NPM_FLAGS_VALUE: "--legacy-peer-deps"
        run: bash scripts/ci/netlify-iac-deploy.sh
