[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Next.js specific settings
[functions]
  directory = ".netlify/functions"
  node_bundler = "esbuild"
  # Include data files in serverless functions
  included_files = ["data/**"]
  # External node modules to reduce bundle size
  external_node_modules = ["xlsx"]

# Specific configuration for Next.js server handler
[functions."___netlify-server-handler"]
  # Include all data files
  included_files = ["data/**/*.xlsx", "data/**/*.csv"]

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/backtest/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
